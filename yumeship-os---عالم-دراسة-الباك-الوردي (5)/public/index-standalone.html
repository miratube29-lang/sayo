    const WebAudio = {
      ctx: null,
      getCtx() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      playClick() {
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } catch(e){}
      },
      playBell() {
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.1);
            gain.gain.setValueAtTime(0.12, now + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.8);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.1);
            osc.stop(now + i * 0.1 + 0.9);
          });
        } catch(e){}
      }
    };

            <span class="px-2.5 py-0.5 rounded-full text-xs font-bold brand-btn font-comfortaa">مرحباً بك 🌸</span>
            <h2 class="text-2xl font-black text-slate-800 mt-2">${state.userProfile.name}</h2>
            <p class="text-xs text-slate-600 mt-1">${state.userProfile.motto}</p>
            <div class="mt-4 flex gap-2">
              <button onclick="setTab('pomodoro')" class="px-4 py-2 rounded-xl brand-btn text-white text-xs font-bold cursor-pointer">
                ⏱️ ابدأ جلسة بومودورو
              </button>
              <button onclick="setTab('subjects')" class="px-4 py-2 rounded-xl bg-white border brand-border brand-text text-xs font-bold cursor-pointer">
                📚 تصفح المنهاج
              </button>
            </div>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="glass-card rounded-2xl p-4 border brand-border text-center">
              <span class="text-xl block">🔥</span>
              <span class="text-xl font-bold brand-text">${state.pomodoroStats.streakDays}</span>
              <span class="text-[11px] text-slate-400 block">أيام حماس</span>
            </div>
            <div class="glass-card rounded-2xl p-4 border brand-border text-center">
              <span class="text-xl block">⏱️</span>
              <span class="text-xl font-bold text-purple-600">${((state.pomodoroStats.totalSecondsStudied || 0) / 3600).toFixed(1)}h</span>
              <span class="text-[11px] text-slate-400 block">ساعات مراجعة</span>
            </div>
            <div class="glass-card rounded-2xl p-4 border brand-border text-center">
              <span class="text-xl block">🎯</span>
              <span class="text-xl font-bold text-emerald-600">100%</span>
              <span class="text-[11px] text-slate-400 block">جاهزية الباك</span>
            </div>
            <div class="glass-card rounded-2xl p-4 border brand-border text-center">
              <span class="text-xl block">🎓</span>
              <span class="text-xl font-bold text-rose-500">18.00</span>
              <span class="text-[11px] text-slate-400 block">المعدل المستهدف</span>
            </div>
          </div>
        </div>
      `;
    }

    window.setTab = function(t) {
      WebAudio.playClick();
      tab = t;
      render();
    };

    window.toggleLesson = function(s, u, l) {
      WebAudio.playClick();
      const les = state.subjects[s].units[u].lessons[l];
      les.status = les.status === 'mastered' ? 'not_started' : 'mastered';
      if (les.status === 'mastered') WebAudio.playBell();
      saveState();
      render();
    };

    window.toggleGoal = function(m, g) {
      WebAudio.playClick();
      const goal = state.months[m].generalGoals[g];
      goal.isCompleted = !goal.isCompleted;
      if (goal.isCompleted) WebAudio.playBell();
      saveState();
      render();
    };

    window.togglePomo = function() {
      WebAudio.playClick();
      pomoRunning = !pomoRunning;
      if (pomoRunning) {
        pomoTimer = setInterval(() => {
          if (pomoLeft > 0) {
            pomoLeft--;
            state.pomodoroStats.totalSecondsStudied++;
            const el = document.getElementById('pomo-num');
            if (el) el.innerText = formatTime(pomoLeft);
          } else {
            clearInterval(pomoTimer);
            pomoRunning = false;
            WebAudio.playBell();
            render();
          }
        }, 1000);
      } else {
        clearInterval(pomoTimer);
      }
      render();
    };

    window.resetPomo = function() {
      WebAudio.playClick();
      clearInterval(pomoTimer);
      pomoRunning = false;
      pomoLeft = 25 * 60;
      render();
    };

    window.downloadSelf = function() {
      WebAudio.playBell();
      const full = '<!DOCTYPE html>\\n' + document.documentElement.outerHTML;
      const b = new Blob([full], { type: 'text/html;charset=utf-8' });
      const u = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href = u;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(u);
    };

    render();
  </script>
</body>
</html>
